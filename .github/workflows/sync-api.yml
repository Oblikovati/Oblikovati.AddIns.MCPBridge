name: Sync API version

# Keep go.mod's `require oblikovati.org/api` pinned to the latest released API version,
# automatically. When the API publishes a new release, this opens a PR that bumps the
# require, regenerates the tool surface against that version, and tidies go.sum — then
# enables auto-merge so it lands once CI is green. Hourly + on demand.
on:
  schedule:
    - cron: "20 * * * *" # hourly, offset from publish.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Oblikovati/Oblikovati.API
          ref: develop
          path: _api
      - uses: actions/checkout@v5
        with:
          repository: Oblikovati/Oblikovati
          ref: develop
          path: _app
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view -R Oblikovati/Oblikovati.API --json tagName -q .tagName 2>/dev/null || echo "")
          current=$(go mod edit -json | jq -r '.Require[]|select(.Path=="oblikovati.org/api").Version')
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "API released $latest (go.mod has $current) — bumping."
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "go.mod already on $current (latest release: ${latest:-none}) — nothing to do."
          fi
      - name: Bump, regenerate, tidy
        if: steps.ver.outputs.bump == 'true'
        run: |
          # Resolve siblings locally (committed go.mod has no replace) so generate/tidy work.
          go mod edit -replace oblikovati.org/api="$GITHUB_WORKSPACE/_api"
          go mod edit -replace oblikovati.org="$GITHUB_WORKSPACE/_app"
          go mod edit -require oblikovati.org/api@${{ steps.ver.outputs.latest }}
          go generate ./...
          go mod tidy
          # The replaces are CI-only; never commit them.
          go mod edit -dropreplace oblikovati.org/api -dropreplace oblikovati.org
      - name: Open auto-merging PR
        if: steps.ver.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No file changes after bump — skipping."
            exit 0
          fi
          branch="chore/api-${{ steps.ver.outputs.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -aqm "chore: bump oblikovati.org/api to ${{ steps.ver.outputs.latest }}

          The API released ${{ steps.ver.outputs.latest }}; pin the require to it and
          regenerate the tool surface against it (automated by sync-api.yml)."
          git push -u origin "$branch" --force
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "chore: bump oblikovati.org/api to ${{ steps.ver.outputs.latest }}" \
            --body "Automated by \`sync-api.yml\`: the API released **${{ steps.ver.outputs.latest }}**. Bumps \`go.mod\`'s \`require oblikovati.org/api\`, regenerates \`bridge/tools_generated.go\` against it, and tidies \`go.sum\`. Auto-merges once CI is green." \
            || true
          gh pr merge "$branch" --auto --merge || echo "auto-merge not enabled; PR left for manual merge"
