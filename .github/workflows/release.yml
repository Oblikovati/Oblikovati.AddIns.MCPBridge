name: Release

# The single add-in release pipeline. Hourly (and on demand) it tracks the latest
# PUBLISHED oblikovati.org/api release and, when the bridge has not shipped for it yet:
#   1. regenerates the MCP tool surface from that API release,
#   2. builds the c-shared add-in for every OS,
#   3. publishes a GitHub release (tag `api-<version>`), and
#   4. commits the bumped go.mod pin + regenerated surface back to the default branch,
#      so the repo always reflects the API release the bridge is built against.
# It is idempotent: a run for an API release that already shipped is a no-op.
on:
  schedule:
    - cron: "0 * * * *" # top of every hour
  workflow_dispatch:
    inputs:
      api_ref:
        description: "API release to build against (tag/sha; default: the latest published release)"
        required: false
        default: ""

permissions:
  contents: read

# One release at a time (the sync job pushes to the default branch).
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Resolve the API release to track and decide whether the bridge needs building.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      api_tag: ${{ steps.decide.outputs.api_tag }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ github.event.inputs.api_ref }}
        run: |
          set -euo pipefail
          api_tag="$OVERRIDE"
          if [ -z "$api_tag" ]; then
            api_tag=$(gh release view -R Oblikovati/Oblikovati.API --json tagName -q .tagName)
          fi
          if [ -z "$api_tag" ]; then
            echo "no oblikovati.org/api release found" >&2
            exit 1
          fi
          tag="api-$api_tag" # the bridge release is named for the API release it tracks
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "bridge already shipped for API $api_tag ($tag) — nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "API released $api_tag — building bridge $tag."
          fi
          echo "api_tag=$api_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Regenerate the tool surface from that API release and build the c-shared add-in per OS.
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/siblings
        with:
          api-ref: ${{ needs.check.outputs.api_tag }}
      - name: Regenerate tool surface from the API release
        run: go generate ./...
      - name: Build c-shared library
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) ext=dll; plat=windows-amd64 ;;
            macOS)   ext=dylib; plat=darwin-$(uname -m) ;;
            *)       ext=so; plat=linux-amd64 ;;
          esac
          mkdir -p dist
          go build -buildmode=c-shared -o "dist/oblikovati-mcp-bridge-$plat.$ext" .
          cp manifest.json dist/manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: bridge-${{ matrix.os }}
          path: dist/*

  # Cut the bridge GitHub release for this API version.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          API_TAG: ${{ needs.check.outputs.api_tag }}
        run: |
          gh release create "$TAG" dist/* \
            -R "$GITHUB_REPOSITORY" \
            --title "MCP bridge — API $API_TAG" \
            --notes "Auto-built oblikovati-mcp-bridge against oblikovati.org/api $API_TAG. The MCP tool surface is generated from that release's mcp: annotations. Artifacts: c-shared library per OS + manifest.json."

  # Commit the bumped pin + regenerated surface back, so the repo matches what shipped.
  sync:
    needs: [check, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/siblings
        with:
          api-ref: ${{ needs.check.outputs.api_tag }}
      - name: Pin go.mod to the API release and regenerate
        env:
          API_TAG: ${{ needs.check.outputs.api_tag }}
        run: |
          set -euo pipefail
          go mod edit -require "oblikovati.org/api@$API_TAG"
          go generate ./...
          go mod tidy
          # The replaces are CI-only; never commit them.
          go mod edit -dropreplace oblikovati.org/api -dropreplace oblikovati.org
      - name: Commit if changed
        env:
          API_TAG: ${{ needs.check.outputs.api_tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod go.sum bridge/tools_generated.go; then
            echo "repo already tracks API $API_TAG — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum bridge/tools_generated.go
          git commit -m "chore: bridge tracks oblikovati.org/api $API_TAG [skip ci]"
          git push origin "HEAD:$BRANCH"
