# SonarCloud (Automatic Analysis) scope for oblikovati-mcp-bridge.
#
# The shipped library and the maintained generator (bridge/, internal/mcpgen, export.go,
# manifest.go) are held to the full ruleset. Non-product code is scoped so it neither
# generates noise nor distorts the duplication metric:
#
#   - bridge/tools_generated.go is GENERATED (DO NOT EDIT) — excluded from analysis. It
#     is ~345 near-identical addForward[...] registration lines, which would otherwise
#     dominate the duplication number for no value.
#   - cmd/** are manual / integration MCP drivers (notably the NopSCADlib live-modeling
#     harness, dozens of one-part-per-file scenarios), and **/*_test.go is test
#     scaffolding. Both legitimately repeat setup and run long, linear scenarios, so they
#     are excluded from copy/paste detection and from the production-targeted
#     maintainability rules (cognitive complexity, duplicated literals, context-in-struct,
#     parameter style). They are still analyzed for bugs and vulnerabilities.

# Generated code is not analyzed at all.
sonar.exclusions=bridge/tools_generated.go

# Duplication: ignore generated code, dev drivers, and test scaffolding.
sonar.cpd.exclusions=bridge/tools_generated.go,cmd/**/*,**/*_test.go

# Maintainability/style rules that target production code, scoped off the drivers/tests.
sonar.issue.ignore.multicriteria=cmd1,cmd2,cmd3,cmd4,t1,t2,t3
sonar.issue.ignore.multicriteria.cmd1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.cmd1.resourceKey=cmd/**/*
sonar.issue.ignore.multicriteria.cmd2.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.cmd2.resourceKey=cmd/**/*
sonar.issue.ignore.multicriteria.cmd3.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.cmd3.resourceKey=cmd/**/*
sonar.issue.ignore.multicriteria.cmd4.ruleKey=godre:S8209
sonar.issue.ignore.multicriteria.cmd4.resourceKey=cmd/**/*
sonar.issue.ignore.multicriteria.t1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.t1.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.t2.ruleKey=go:S107
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.t3.ruleKey=godre:S8193
sonar.issue.ignore.multicriteria.t3.resourceKey=**/*_test.go
